<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UChat 채팅</title>
  <script async src="https://client.uchat.io/uchat.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding-right: 420px;
      background: #f5f7fb;
      font-family: sans-serif;
    }

    .page-content {
      padding: 24px;
    }

    .chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 100vh;
      min-width: 280px;
      min-height: 320px;
      max-width: 90vw;
      max-height: 100vh;
      overflow: auto;
      resize: both;
      border-left: 1px solid #d1d5db;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
    }

    .chat-toolbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 8px 12px;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-title {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    .chat-actions {
      display: flex;
      gap: 8px;
    }

    .chat-actions button {
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
    }

    .chat-actions button:hover {
      background: #e5e7eb;
    }

    u-chat {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: #fff;
    }

    .chat-panel.is-wide {
      width: 600px;
      max-width: 90vw;
    }

    @media (max-width: 600px) {
      body {
        padding-right: 0;
      }

      .page-content {
        display: none;
      }

      .chat-panel,
      .chat-panel.is-wide {
        width: 100vw;
        height: 100vh;
        min-width: 0;
        min-height: 0;
        max-width: 100vw;
        max-height: 100vh;
        resize: none;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page-content">
    <h1>UChat</h1>
    <p>채팅창은 화면 오른쪽에 고정되어 있습니다.</p>
  </main>

  <aside class="chat-panel" id="chat-panel" aria-label="UChat 채팅창">
    <div class="chat-toolbar">
      <span class="chat-title">채팅</span>
      <div class="chat-actions">
        <button id="size-toggle" type="button" aria-pressed="false">넓게</button>
        <button id="open-window" type="button">새 창에서 열기</button>
      </div>
    </div>
    <u-chat room="qoooang1"></u-chat>
  </aside>

  <script>
    const panel = document.getElementById('chat-panel');
    const sizeToggle = document.getElementById('size-toggle');

    sizeToggle.addEventListener('click', () => {
      const isWide = panel.classList.toggle('is-wide');
      sizeToggle.textContent = isWide ? '기본 폭' : '넓게';
      sizeToggle.setAttribute('aria-pressed', String(isWide));
    });

    document.getElementById('open-window').addEventListener('click', () => {
      const newWindow = window.open(
        window.location.href,
        'uchat-chat-window',
        'popup=yes,width=520,height=720,resizable=yes,scrollbars=no'
      );
      if (!newWindow) {
        alert('새 창이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');
      }
    });
  </script>
</body>
</html>
