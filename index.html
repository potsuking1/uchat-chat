<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UChat 채팅</title>
  <script async src="https://client.uchat.io/uchat.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root { --chat-width: 420px; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding-right: var(--chat-width);
      background: #f5f7fb;
      font-family: sans-serif;
    }

    .page-content { padding: 24px; }

    .chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      width: var(--chat-width);
      height: 100vh;
      min-width: 280px;
      min-height: 320px;
      max-width: 90vw;
      overflow: visible;
      border-left: 1px solid #d1d5db;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
    }

    u-chat {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: #fff;
    }

    .resize-handle {
      position: absolute;
      top: 50%;
      left: -7px;
      z-index: 2;
      display: grid;
      width: 12px;
      height: 35px;
      padding: 0;
      place-items: center;
      transform: translateY(-50%);
      border: 1px solid #64748b;
      border-radius: 7px;
      background: #334155;
      color: #cbd5e1;
      cursor: ew-resize;
      touch-action: none;
      user-select: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
    }

    .resize-handle:hover,
    .resize-handle:focus-visible,
    .chat-panel.is-resizing .resize-handle {
      background: #475569;
      border-color: #94a3b8;
      outline: 2px solid rgba(148, 163, 184, 0.25);
    }

    .resize-grip {
      width: 6px;
      height: 16px;
      border-radius: 1px;
      background: repeating-linear-gradient(
        to bottom,
        #cbd5e1 0 2px,
        transparent 2px 6px
      );
    }

    .resize-tooltip {
      position: absolute;
      top: 50%;
      right: calc(100% + 10px);
      width: max-content;
      max-width: min(250px, 70vw);
      padding: 8px 10px;
      transform: translateY(-50%);
      border: 1px solid #374151;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .resize-handle:hover .resize-tooltip,
    .resize-handle:focus-visible .resize-tooltip,
    .chat-panel.is-resizing .resize-tooltip {
      opacity: 1;
    }

    @media (max-width: 600px) {
      :root { --chat-width: 100vw; }

      body { padding-right: 0; }
      .page-content { display: none; }

      .chat-panel {
        width: var(--chat-width);
        min-width: min(280px, 100vw);
        max-width: 100vw;
        border: 0;
      }

      .resize-handle { left: 2px; }
    }
  </style>
</head>
<body>
  <main class="page-content">
    <h1>UChat</h1>
  </main>

  <aside class="chat-panel" id="chat-panel" aria-label="UChat 채팅창">
    <button class="resize-handle" id="resize-handle" type="button" aria-label="채팅창 너비 조절" title="좌우로 드래그하여 채팅창 크기 조절">
      <span class="resize-grip" aria-hidden="true"></span>
      <span class="resize-tooltip" role="tooltip">좌우로 드래그하여 채팅창 크기 조절</span>
    </button>
    <u-chat room="qoooang1"></u-chat>
  </aside>

  <script>
    const panel = document.getElementById('chat-panel');
    const root = document.documentElement;
    const resizeHandle = document.getElementById('resize-handle');
    let dragStartX = 0;
    let dragStartWidth = 0;

    function setWidth(width) {
      const minWidth = Math.min(280, window.innerWidth);
      const maxWidth = Math.min(window.innerWidth * 0.9, window.innerWidth);
      const nextWidth = Math.max(minWidth, Math.min(maxWidth, width));
      root.style.setProperty('--chat-width', `${nextWidth}px`);
      document.body.style.paddingRight = window.matchMedia('(max-width: 600px)').matches
        ? '0'
        : `${nextWidth}px`;
    }

    resizeHandle.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      event.preventDefault();
      dragStartX = event.clientX;
      dragStartWidth = panel.getBoundingClientRect().width;
      panel.classList.add('is-resizing');
      resizeHandle.setPointerCapture(event.pointerId);
    });

    resizeHandle.addEventListener('pointermove', (event) => {
      if (!resizeHandle.hasPointerCapture(event.pointerId)) return;
      setWidth(dragStartWidth + dragStartX - event.clientX);
    });

    function stopResize(event) {
      panel.classList.remove('is-resizing');
      if (resizeHandle.hasPointerCapture(event.pointerId)) {
        resizeHandle.releasePointerCapture(event.pointerId);
      }
    }

    resizeHandle.addEventListener('pointerup', stopResize);
    resizeHandle.addEventListener('pointercancel', stopResize);

    window.addEventListener('resize', () => {
      setWidth(panel.getBoundingClientRect().width);
    });
  </script>
</body>
</html>
